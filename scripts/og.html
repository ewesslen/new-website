<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Familjen Grotesk Variable';
    src: url('../node_modules/@fontsource-variable/familjen-grotesk/files/familjen-grotesk-latin-wght-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Hanken Grotesk Variable';
    src: url('../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2') format('woff2');
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #0a0d18;
    color: #e8ebf2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 84px 96px 72px;
    font-family: 'Hanken Grotesk Variable', sans-serif;
  }
  h1 {
    font-family: 'Familjen Grotesk Variable', sans-serif;
    font-variation-settings: 'wght' 700;
    font-size: 148px;
    line-height: 0.95;
    letter-spacing: -0.025em;
  }
  .tagline {
    font-family: 'Hanken Grotesk Variable', sans-serif;
    font-variation-settings: 'wght' 400;
    font-size: 54px;
    color: #9aa3b8;
    margin-top: 34px;
  }
  .accents {
    display: flex;
    gap: 14px;
  }
  .accents span {
    height: 10px;
    border-radius: 5px;
    flex: 1;
  }
</style>
</head>
<body>
  <div>
    <h1>Erik Wesslen</h1>
    <p class="tagline">One person. Several bets.</p>
  </div>
  <div class="accents" aria-hidden="true">
    <span style="background:#e3b961"></span>
    <span style="background:#63c6a0"></span>
    <span style="background:#35e58c"></span>
    <span style="background:#e2c170"></span>
    <span style="background:#96a6ff"></span>
    <span style="background:#f0a07a"></span>
    <span style="background:#bfa0ff"></span>
  </div>
</body>
</html>
