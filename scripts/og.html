<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Fraunces Variable';
    src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Fraunces Variable';
    font-style: italic;
    src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-wght-italic.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Inter Variable';
    src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2');
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #faf7f2;
    color: #201c16;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 84px 96px 72px;
    font-family: 'Inter Variable', sans-serif;
  }
  h1 {
    font-family: 'Fraunces Variable', serif;
    font-variation-settings: 'wght' 620;
    font-size: 190px;
    line-height: 0.95;
    letter-spacing: -0.015em;
  }
  .tagline {
    font-family: 'Fraunces Variable', serif;
    font-style: italic;
    font-variation-settings: 'wght' 420;
    font-size: 54px;
    color: #5c5546;
    margin-top: 34px;
  }
  .accents {
    display: flex;
    gap: 14px;
  }
  .accents span {
    height: 10px;
    border-radius: 5px;
    flex: 1;
  }
</style>
</head>
<body>
  <div>
    <h1>Erik</h1>
    <p class="tagline">One person. Several bets.</p>
  </div>
  <div class="accents" aria-hidden="true">
    <span style="background:#1d5c42"></span>
    <span style="background:#8a6d1f"></span>
    <span style="background:#0b6b35"></span>
    <span style="background:#6f5410"></span>
    <span style="background:#2b3cc4"></span>
    <span style="background:#8a4520"></span>
    <span style="background:#6d28a8"></span>
  </div>
</body>
</html>
